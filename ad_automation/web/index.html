<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>素材流水线</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/web/styles.css">
</head>
<body>
  <header class="topbar"><div><p class="kicker">AD OPERATIONS / LOCAL DEMO</p><h1>素材流水线</h1></div><div class="health"><span id="health-dot"></span><span id="health-text">检查服务中</span></div></header>
  <main class="shell">
    <nav class="tabs" aria-label="主要视图"><button class="tab active" data-view="assets">素材库</button><button class="tab" data-view="jobs">处理任务</button><button class="tab" data-view="platforms">平台状态</button><button class="tab" data-view="alerts">异常中心 <span id="alert-count" class="count">0</span></button></nav>
    <section id="view-assets" class="view active"><div class="view-head"><div><h2>素材库</h2><p>上传、指纹检测并挑选进入处理队列的素材。</p></div><label class="upload"><span>上传视频</span><input id="file" type="file" accept="video/mp4,video/quicktime,video/webm"></label></div><div id="asset-list" class="table-wrap"></div></section>
    <section id="view-jobs" class="view"><div class="view-head"><div><h2>处理任务</h2><p>FFmpeg 任务在本地后台执行，产物写入隔离目录。</p></div><button id="refresh-jobs" class="button secondary">刷新任务</button></div><div id="job-list" class="table-wrap"></div></section>
    <section id="view-platforms" class="view"><div class="view-head"><div><h2>平台状态</h2><p>当前使用 Mock 平台验证同步和 SPI 回调契约。</p></div></div><div id="platform-list" class="platform-grid"></div></section>
    <section id="view-alerts" class="view"><div class="view-head"><div><h2>异常中心</h2><p>失败任务、平台拒绝和签名错误会在这里留下可追溯记录。</p></div><button id="refresh-alerts" class="button secondary">刷新告警</button></div><div id="alert-list" class="table-wrap"></div></section>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/web/app.js"></script>
</body></html>
